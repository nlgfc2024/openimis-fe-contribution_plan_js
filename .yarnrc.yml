approvedGitRepositories:
  - "https://github.com/openimis/*.git"
  - "https://github.com/openimis/*"
  - "https://github.com/nlgfc2024/*.git"
  - "https://github.com/nlgfc2024/*"
  - "https://github.com/*"
  - "*"

enableHardenedMode: false

enableScripts: true

enableStrictSsl: true

httpTimeout: 120000

nodeLinker: node-modules

# registry.npmjs.org is TLS/SNI-blocked on the WBG network; this mirror is not.
npmRegistryServer: "https://registry.yarnpkg.com"
